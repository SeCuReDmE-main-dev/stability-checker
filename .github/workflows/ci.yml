name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate data
        run: python -c "import json; json.load(open('data/clauses.json', encoding='utf-8'))"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Audit evidence sheet
        run: PYTHONPATH=src python -m stability_checker.research audit docs/evidence.md
