<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Stella the snowbird, wearing a sun hat and holding a checklist">
  <title>Stella the snowbird</title>
  <ellipse cx="60" cy="112" rx="30" ry="4" fill="#1f1d2b" opacity=".12"/>
  <!-- body -->
  <circle cx="60" cy="68" r="38" fill="#7c3aed"/>
  <ellipse cx="60" cy="80" rx="25" ry="22" fill="#ede9fe"/>
  <!-- wings -->
  <ellipse cx="23" cy="74" rx="9" ry="15" fill="#6d28d9" transform="rotate(20 23 74)"/>
  <!-- eyes -->
  <circle cx="47" cy="58" r="9" fill="#fff"/>
  <circle cx="73" cy="58" r="9" fill="#fff"/>
  <circle cx="49" cy="60" r="5" fill="#1f1d2b"/>
  <circle cx="71" cy="60" r="5" fill="#1f1d2b"/>
  <circle cx="51" cy="58" r="1.8" fill="#fff"/>
  <circle cx="73" cy="58" r="1.8" fill="#fff"/>
  <!-- cheeks and beak -->
  <ellipse cx="39" cy="71" rx="5" ry="3" fill="#f9a8d4"/>
  <ellipse cx="81" cy="71" rx="5" ry="3" fill="#f9a8d4"/>
  <path d="M55 68 L65 68 L60 75 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- sun hat: she flies south for the winter -->
  <ellipse cx="60" cy="32" rx="34" ry="7" fill="#fbbf24"/>
  <path d="M42 32 Q44 14 60 14 Q76 14 78 32 Z" fill="#fcd34d"/>
  <rect x="43" y="26" width="34" height="5" fill="#6d28d9"/>
  <!-- checklist -->
  <g transform="rotate(-8 92 88)">
    <rect x="80" y="72" width="26" height="32" rx="3" fill="#fff" stroke="#1f1d2b" stroke-width="2"/>
    <path d="M85 81 L88 84 L93 78" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M85 93 L88 96 L93 90" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 81 H101 M96 93 H101" stroke="#1f1d2b" stroke-width="2" stroke-linecap="round"/>
  </g>
  <ellipse cx="86" cy="86" rx="7" ry="10" fill="#6d28d9" transform="rotate(-30 86 86)"/>
  <!-- feet -->
  <path d="M50 105 L48 111 M54 105 L54 111 M66 105 L66 111 M70 105 L72 111" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
</svg>
